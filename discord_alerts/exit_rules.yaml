# exit_rules.yaml — rule-driven exits for Ravish copy-trading
# ============================================================
# Ravish only posts ENTRIES; the EXIT is ours. These rules decide when to
# close, applied to the P&L he reports in each trade's thread (and the update
# channel). profit_target_pct is on the position (premium for shorts / debit
# for longs), consistent with his "X% profit" posts.
#
# Profit targets were RECALIBRATED from a full replay of his Aug–Oct 2026
# alerts (see claude/ravish-copy-trading-plan.md): old targets for calendars/
# diagonals/LEAPS sat above where those strategies actually trade, so the PT
# never fired. Targets now sit where the profit lives; auto_close_at_pt is TRUE
# so OUR target drives the exit.
#
# stop_loss_pct (positive number): close if the position is down that much
# (pnl_pct <= -stop_loss_pct). A conservative CATASTROPHE guard, not a fine-
# tuned level — the data has only a couple of reversers, so stops are set loose
# to avoid whipsawing out of winners that dip. Tune as live data accumulates.
#
# Capital rotation (close an aged winner to fund a better new signal when
# buying power is short) is handled by capital_manager.py, not these rules.

position_sizing:
  total_capital: 100000
  max_deployed_pct: 0.60
  margin_buffer_pct: 0.25
  opportunity_reserve_pct: 0.15   # dry powder for rotation into better setups
  max_concurrent_positions: 8

rules:
  spx_calendar:
    match:
      action: BTO
      symbol: SPX
      strategy_type: call_calendar
    profit_target_pct: 45          # was 75 — calendars top ~40-56%, 75 never hit
    stop_loss_pct: 50
    dte_stop: 2
    max_notional: 5000
    auto_close_at_dte: true
    auto_close_at_pt: true         # our target now drives the exit
    auto_close_at_stop: true
    auto_close_ravish: true

  double_calendar:                 # QQQ etc. double calendars (were hitting default PT50)
    match:
      strategy_type: [double_calendar, calendar]
    profit_target_pct: 45          # in-sample tops ~27-56%
    stop_loss_pct: 50
    dte_stop: 3
    max_notional: 5000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  double_diagonal:                 # QQQ double diagonals (were hitting default PT50)
    match:
      strategy_type: [double_diagonal, diagonal]
    profit_target_pct: 30          # in-sample tops ~25-30%
    stop_loss_pct: 50
    dte_stop: 3
    max_notional: 5000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  short_put_leaps:
    match:
      action: STO
      min_dte_at_entry: 60
    profit_target_pct: 60          # was 75 — grinds up slowly; lock gains + recycle
    stop_loss_pct: 150             #   the large capital a LEAPS ties up
    dte_stop: 30
    max_notional: 25000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  short_put_stable:
    match:
      action: STO
      symbols: [NVDA, AMAT, AVGO, VRT, TSM, AAPL, PLTR, META, MRVL, MCD, MU]
    profit_target_pct: 70          # was 60 — they climb steadily to 70-100%
    stop_loss_pct: 150             # ~2x credit catastrophe guard
    dte_stop: 14
    max_notional: 12000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  short_put_volatile:
    match:
      action: STO
      symbols: [TQQQ, UPRO, CRWV, DRAM, SOFI, SOXL, NBIS]
    profit_target_pct: 55          # was 50
    stop_loss_pct: 100             # tighter — volatile names
    dte_stop: 7
    max_notional: 8000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  short_put_qqq:
    match:
      action: STO
      symbols: [QQQ]
    profit_target_pct: 70          # was 60
    stop_loss_pct: 150
    dte_stop: 14
    max_notional: 10000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  spread:
    match:
      strategy_type: [call_spread, put_spread]
    profit_target_pct: 70          # was 60 — defined risk; NOT in-sample "ride to 200%"
    stop_loss_pct: 75
    dte_stop: 5
    max_notional: 5000
    auto_close_at_dte: true
    auto_close_at_pt: true
    auto_close_at_stop: true
    auto_close_ravish: true

  default:
    match: {}
    profit_target_pct: 50
    stop_loss_pct: 100
    dte_stop: 14
    max_notional: 5000
    auto_close_at_dte: false
    auto_close_at_pt: false
    auto_close_at_stop: false
    auto_close_ravish: true
