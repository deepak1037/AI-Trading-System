[project]
name = "ai-trading-system"
version = "0.1.0"
description = "Automated AI + algorithmic stock trading system"
requires-python = "==3.12.7"

# ── Black ─────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | paper_trading/(accounts|trades|backups)
)/
'''

# ── Ruff ──────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".venv",
    "paper_trading/accounts",
    "paper_trading/trades",
    "paper_trading/backups",
    "db",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by black
    "RUF001", # ambiguous unicode in strings (we use σ, box-drawing chars)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "core",
    "broker_core",
    "broker_client",
    "paper_trading",
    "signals",
    "watcher",
    "scanner",
    "alerts",
    "v2",
    "backtests",
]

# ── Mypy ──────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true
exclude = [
    "paper_trading/accounts",
    "paper_trading/trades",
    "paper_trading/backups",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party libs without type stubs or with incomplete stubs.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "pandas_ta.*",
    "schwab.*",
    "alpaca.*",
    "yfinance.*",
    "fredapi.*",
    "edgar.*",
    "lumibot.*",
    "vectorbt.*",
    "arch.*",
    "apscheduler.*",
    "twilio.*",
    "sendgrid.*",
    "pandas_market_calendars.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: marks tests that hit real external APIs (run with -m integration)",
]
