name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for CI
        run: |
          cp .env.example .env
          echo "ENV=development" >> .env
          echo "DRY_RUN=True" >> .env
          echo "LIVE_TRADING_ENABLED=False" >> .env

      - name: Run ruff linter
        run: |
          python -m ruff check . --select E,F --ignore E501 --exclude .venv

      - name: Run mypy type checks
        run: |
          python -m mypy config core signals watcher alerts broker_core broker_client paper_trading backtests \
            --ignore-missing-imports \
            --disable-error-code=unused-ignore \
            --disable-error-code=misc \
            --disable-error-code=no-untyped-def \
            || true  # non-blocking until fully typed

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short --co -q 2>&1 | tail -5
          python -m pytest tests/ --tb=short -q
        env:
          ENV: development
          DRY_RUN: "True"
          LIVE_TRADING_ENABLED: "False"

      - name: Upload coverage report
        if: always()
        run: |
          python -m pytest tests/ --cov=. --cov-report=xml -q 2>/dev/null || true
